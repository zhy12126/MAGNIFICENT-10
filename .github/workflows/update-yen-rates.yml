name: Update yen analysis data

on:
  schedule:
    # Run daily so expired calendar entries are removed on weekends as well.
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify policy-rate parsing and safe updates
        run: python -m unittest discover -s scripts -p test_policy_rates.py
      - name: Verify government yield parsing and safe updates
        run: python -m unittest discover -s scripts -p test_bond_yields.py
      - name: Fetch official FX history and build attribution
        run: python scripts/fetch_yen_rates.py
      - name: Build reviewed official event calendar
        run: python scripts/build_yen_events.py
      - name: Fetch central bank policy-rate histories
        run: python scripts/fetch_policy_rates.py
      - name: Fetch official government bond yield curves
        run: python scripts/fetch_bond_yields.py
      - name: Commit yen snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data/yen-rates.json outputs/data/yen-events.json outputs/data/policy-rates.json outputs/data/bond-yields.json
          git diff --cached --quiet || git commit -m "chore: update yen analysis snapshot"
          git pull --rebase
          git push
