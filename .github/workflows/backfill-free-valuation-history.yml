name: Backfill free valuation history

on:
  workflow_dispatch:
  schedule:
    # Check every Monday; the gate below runs the audit only on the first one.
    - cron: '15 18 * * 1'

permissions:
  contents: write

concurrency:
  group: valuation-data-writer
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether this is the first Monday
        id: monthly
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 07 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.monthly.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.monthly.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install Korean filing and market client
        if: steps.monthly.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Backfill historical valuation series from SEC EDGAR and Stooq
        if: steps.monthly.outputs.run == 'true'
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: python scripts/fetch_free_valuation_history.py
      - name: Rebuild TSM history
        if: steps.monthly.outputs.run == 'true'
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          REBUILD_TICKERS: TSM
        run: python scripts/rebuild_selected_history.py
      - name: Rebuild separate SKHY history
        if: steps.monthly.outputs.run == 'true'
        run: python scripts/fetch_skhy_history.py
      - name: Align the latest market snapshot
        if: steps.monthly.outputs.run == 'true'
        run: python scripts/fetch_market_data.py
      - name: Normalize and audit all valuation data
        if: steps.monthly.outputs.run == 'true'
        run: python scripts/validate_valuation_consistency.py --fix
      - name: Commit historical valuation data
        if: steps.monthly.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data/history.json outputs/data/stocks.json
          git diff --cached --quiet || git commit -m "chore: monthly full valuation history audit"
          git push
