name: Update SPY concentration

on:
  schedule:
    # 23:05 UTC = 08:05 JST (next calendar day) / 19:05 ET in daylight saving.
    # Runs after the main market-data task and after the US close, so SPY has
    # a dedicated Alpha Vantage request and an independently visible outcome.
    - cron: '5 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-spy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch SPY holdings concentration
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/fetch_spy_concentration.py
      - name: Commit SPY concentration snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data/concentration.json
          git diff --cached --quiet || git commit -m "chore: update SPY concentration"
          git push
