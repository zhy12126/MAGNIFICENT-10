name: Update SPY concentration

on:
  schedule:
    # 次日美东清晨运行，给 State Street 足够时间发布正式持仓文件。
    # UTC 10:15 = 美东夏令时 06:15；周五数据在日本时间周六更新。
    - cron: '15 10 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-writer
  cancel-in-progress: false

jobs:
  update-spy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch SPY holdings concentration
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/fetch_spy_concentration.py
      - name: Commit SPY concentration snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data/concentration.json
          git diff --cached --quiet || git commit -m "chore: update SPY concentration"
          git pull --rebase
          git push
