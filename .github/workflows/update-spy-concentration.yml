name: Update SPY concentration

on:
  schedule:
    # 每个美股交易日收盘后运行；UTC 22:45 = 美东夏令时 18:45。
    # 比行情任务（22:30 UTC）晚 15 分钟，降低同时写入 main 的冲突概率。
    # 周五美股收盘后会在日本时间周六 07:45 执行。
    - cron: '45 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-spy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch SPY holdings concentration
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scripts/fetch_spy_concentration.py
      - name: Commit SPY concentration snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data/concentration.json
          git diff --cached --quiet || git commit -m "chore: update SPY concentration"
          git push
