name: Refresh company fundamentals

on:
  workflow_dispatch:
  schedule:
    # Weekly filing check: Sunday 01:15 UTC = Sunday 10:15 Asia/Japan.
    - cron: '15 01 * * 0'
    # Expanded-company group runs Monday to stay within Alpha Vantage's daily quota.
    - cron: '15 01 * * 1'
    # Tuesday backfill: rebuild history for any filings detected on Sunday/Monday.
    # This is separated to avoid exceeding Alpha Vantage's 30 calls/day rate limit.
    - cron: '15 02 * * 2'

permissions:
  contents: write

concurrency:
  group: site-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Korean filing and market client
        run: python -m pip install --disable-pip-version-check yfinance
      - name: Record current fiscal periods
        id: before
        if: github.event.schedule != '15 02 * * 2'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('outputs/data/fundamentals.json', encoding='utf-8'))
          print('periods=' + json.dumps({k:v.get('fiscalPeriodEnd') for k,v in data.get('companies',{}).items()}, sort_keys=True, separators=(',',':')))
          PY
      - name: Refresh generic company filings
        if: github.event.schedule != '15 02 * * 2'
        run: python scripts/fetch_fundamentals.py
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FUNDAMENTAL_TICKERS: ${{ github.event.schedule == '15 01 * * 1' && 'NFLX,MCD,PLTR,LLY,ORCL,AXP' || 'NVDA,AAPL,MSFT,GOOGL,AMZN,META,TSLA,TSM,MU,AVGO,AMD' }}
        continue-on-error: true
      - name: Add SEC net-cash valuation adjustments
        if: github.event.schedule != '15 02 * * 2'
        run: python scripts/enrich_balance_sheet_adjustments.py
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
      - name: Sync refreshed inputs into the website snapshot
        if: github.event.schedule != '15 02 * * 2'
        run: python scripts/sync_fundamentals_to_stocks.py
      - name: Refresh SKHY from its separate K-IFRS path
        if: github.event.schedule != '15 02 * * 2'
        run: python scripts/fetch_skhy_fundamentals.py
      - name: Detect newly available fiscal periods
        id: changed
        if: always()
        env:
          BEFORE_PERIODS: ${{ steps.before.outputs.periods }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          before=json.loads(os.environ.get('BEFORE_PERIODS', '{}') or '{}')
          data=json.load(open('outputs/data/fundamentals.json', encoding='utf-8'))
          after={k:v.get('fiscalPeriodEnd') for k,v in data.get('companies',{}).items()}
          changed=sorted(k for k,v in after.items() if v and before.get(k) != v)
          print('filings_changed=' + ('true' if changed else 'false'))
          print('tickers=' + ','.join(changed))
          print('us_tickers=' + ','.join(k for k in changed if k not in {'TSM','SKHY'}))
          print('us_changed=' + ('true' if any(k not in {'TSM','SKHY'} for k in changed) else 'false'))
          print('tsm_changed=' + ('true' if 'TSM' in changed else 'false'))
          print('skhy_changed=' + ('true' if 'SKHY' in changed else 'false'))
          PY
      - name: Validate refreshed company models
        if: github.event.schedule != '15 02 * * 2'
        run: python scripts/validate_fundamentals.py
      - name: Backfill US valuation history after a new filing
        if: steps.changed.outputs.us_changed == 'true' && github.event.schedule != '15 01 * * 0'
        env:
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          HISTORY_TICKERS: ${{ steps.changed.outputs.us_tickers }}
        run: python scripts/fetch_free_valuation_history.py
      - name: Rebuild TSM history after a new filing
        if: steps.changed.outputs.tsm_changed == 'true' && github.event.schedule != '15 01 * * 0'
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          REBUILD_TICKERS: TSM
        run: python scripts/rebuild_selected_history.py
      - name: Rebuild separate SKHY history after a new filing
        if: steps.changed.outputs.skhy_changed == 'true' && github.event.schedule != '15 01 * * 0'
        run: python scripts/fetch_skhy_history.py
      - name: Align the latest market snapshot after history changes
        if: steps.changed.outputs.filings_changed == 'true'
        run: python scripts/fetch_market_data.py
      - name: Require snapshot/history consistency
        run: python scripts/validate_valuation_consistency.py
      - name: Commit refreshed fundamentals and any affected history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/data/fundamentals.json outputs/data/stocks.json outputs/data/history.json
          git diff --cached --quiet || git commit -m "chore: refresh filings and valuation history"
          git pull --rebase
          git push
